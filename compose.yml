services:
  lgtm:
    image: grafana/otel-lgtm:0.38.1
    ports:
      - "127.0.0.1:7333:3000"
      - "127.0.0.1:4318:4318"
    volumes:
      - htmlshare-lgtm:/data
    labels:
      org.springframework.boot.ignore: "true"
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: htmlshare
      POSTGRES_USER: htmlshare
      POSTGRES_PASSWORD: htmlshare
    ports:
      - "7332:5432"
    volumes:
      - htmlshare-postgres:/var/lib/postgresql/data

volumes:
  htmlshare-lgtm:
  htmlshare-postgres:
