spring.application.name=htmlshare
server.port=7331

spring.datasource.url=${HTMLSHARE_DATASOURCE_URL:jdbc:postgresql://localhost:7332/htmlshare}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${HTMLSHARE_DATASOURCE_USERNAME:htmlshare}
spring.datasource.password=${HTMLSHARE_DATASOURCE_PASSWORD:htmlshare}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.serializer=json
spring.session.timeout=12h

spring.ai.mcp.server.name=htmlshare
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.annotation-scanner.enabled=true

htmlshare.storage-dir=${user.home}/.htmlshare/pages
htmlshare.public-base-url=http://localhost:7331
htmlshare.max-html-bytes=5242880
# Leave blank to allow any email domain.
htmlshare.allowed-email-domain=
