spring.application.name=htmlshare
management.tracing.export.enabled=false
management.otlp.metrics.export.enabled=false
server.port=7331

spring.docker.compose.enabled=false

spring.datasource.url=${HTMLSHARE_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${HTMLSHARE_DATASOURCE_USERNAME}
spring.datasource.password=${HTMLSHARE_DATASOURCE_PASSWORD}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.serializer=json
spring.session.timeout=12h

spring.ai.mcp.server.name=htmlshare
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.annotation-scanner.enabled=true

htmlshare.public-base-url=http://localhost:7331
htmlshare.max-html-bytes=5242880
htmlshare.api-username=${HTMLSHARE_API_USERNAME:htmlshare}
htmlshare.api-password=${HTMLSHARE_API_PASSWORD:htmlshare}
# Leave blank to allow any email domain.
htmlshare.allowed-email-domain=

#---
spring.config.activate.on-profile=local_dev
# Export local logs, traces, and metrics to the LGTM service in compose.yml.
management.tracing.export.enabled=true
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs
management.opentelemetry.logging.export.schedule-delay=1s
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.otlp.metrics.export.step=10s
management.opentelemetry.resource-attributes.service.name=htmlshare
management.opentelemetry.resource-attributes.deployment.environment.name=local
