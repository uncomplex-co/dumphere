<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="|${TITLE} · dumphere|">Artifact · dumphere</title>
  <link rel="stylesheet" href="/viewer/viewer.css">
  <script src="/viewer/comment-composer.js" defer></script>
  <script src="/viewer/discussion-api.js" defer></script>
  <script src="/viewer/discussion-state.js" defer></script>
  <script src="/viewer/reaction-picker.js" defer></script>
  <script src="/viewer/discussions.js" defer></script>
  <script src="/viewer/artifact-messages.js" defer></script>
  <script src="/viewer/artifact-interactions.js" defer></script>
  <script src="/viewer/viewer.js" defer></script>
</head>
<body th:attr="data-id=${ID},data-format=${FORMAT},data-comment-testid=${COMMENT_ID},data-thread-testid=${THREAD_ID},data-reply-testid=${THREAD_REPLY_ID},data-comment-body-testid=${COMMENT_BODY_ID},data-comment-post-testid=${COMMENT_POST_ID},data-comment-cancel-testid=${COMMENT_CANCEL_ID},data-comment-menu-testid=${COMMENT_MENU_ID},data-comment-edit-testid=${COMMENT_EDIT_ID},data-comment-edit-body-testid=${COMMENT_EDIT_BODY_ID},data-comment-edit-save-testid=${COMMENT_EDIT_SAVE_ID},data-comment-edit-cancel-testid=${COMMENT_EDIT_CANCEL_ID},data-visibility=${VISIBILITY},data-public-until=${PUBLIC_UNTIL},data-version=${VERSION},data-can-manage=${CAN_MANAGE},data-can-view=${CAN_VIEW},data-csrf=${CSRF}">
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-check" viewBox="0 0 24 24"><path stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></symbol>
    <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24"><path stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"/></symbol>
    <symbol id="icon-delete" viewBox="0 0 24 24"><path stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/></symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol>
    <symbol id="icon-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></symbol>
    <symbol id="icon-share" viewBox="0 0 24 24"><circle cx="5" cy="12" r="3"/><circle cx="18" cy="5" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8 10 7-4m-7 8 7 4"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-comments" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 1-8 8H5l-4 3V11a9 9 0 0 1 19 0Z"/><path d="M7 9h8M7 13h5"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-reaction" viewBox="0 0 24 24"><path stroke-width="1" stroke-linecap="round" stroke-linejoin="round" d="M15.182 15.182a4.5 4.5 0 0 1-6.364 0M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM9.75 9.75c0 .414-.168.75-.375.75S9 10.164 9 9.75 9.168 9 9.375 9s.375.336.375.75Zm-.375 0h.008v.015h-.008V9.75Zm5.625 0c0 .414-.168.75-.375.75s-.375-.336-.375-.75.168-.75.375-.75.375.336.375.75Zm-.375 0h.008v.015h-.008V9.75Z"/></symbol>
    <symbol id="icon-select-element" viewBox="0 0 24 24"><path stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" d="M15.042 21.672 13.684 16.6m0 0-2.51 2.225.569-9.47 5.227 7.917-3.286-.672Zm-7.518-.267A8.25 8.25 0 1 1 20.25 10.5M8.288 14.212A5.25 5.25 0 1 1 17.25 10.5"/></symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="icon-reload" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6M20 4v7h-7"/></symbol>
    <symbol id="icon-html" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 18"/></symbol>
    <symbol id="icon-markdown" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M5 15V9l3 3 3-3v6m6-6v6m-2-2 2 2 2-2"/></symbol>
  </svg>
  <header class="header">
    <div class="identity">
      <button class="file-icon" id="artifacts-toggle" th:attr="data-testid=${ARTIFACTS_ID}" th:title="${CAN_MANAGE ? 'Your artifacts' : FORMAT_LABEL}" th:disabled="${!CAN_MANAGE}" type="button" aria-label="Your artifacts" aria-expanded="false" aria-controls="artifact-library"><svg aria-hidden="true"><use th:href="|#icon-${FORMAT}|"/></svg></button>
      <div class="artifact-meta"><h1 class="title"><button class="title-menu-trigger" id="title-menu-trigger" th:attr="data-testid=${TITLE_MENU_ID}" type="button" popovertarget="artifact-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="artifact-menu" th:disabled="${!CAN_VIEW}"><span th:text="${TITLE}">Artifact</span><svg aria-hidden="true"><use href="#icon-chevron"/></svg></button></h1><div class="visibility" id="visibility" aria-live="polite"><svg aria-hidden="true"><use id="visibility-icon" href="#icon-lock"/></svg><span id="visibility-label">Internal</span><span id="remaining"></span></div></div>
    </div>
    <div class="actions">
      <button class="icon-button comments-toggle" id="comments-toggle" th:attr="data-testid=${COMMENTS_ID}" aria-label="Comments" title="Comments" aria-expanded="false" aria-controls="comments-panel" th:hidden="${!CAN_VIEW}"><svg aria-hidden="true"><use href="#icon-comments"/></svg></button>
      <a class="button" id="download" th:attr="data-testid=${DOWNLOAD_ID}" th:href="|/p/${ID}/download|" aria-label="Download artifact" th:title="|Download original ${FORMAT_LABEL}|" th:hidden="${!CAN_VIEW}"><svg aria-hidden="true"><use href="#icon-download"/></svg><span class="button-label">Download</span></a>
      <button class="button primary" id="share" th:attr="data-testid=${SHARE_ID}" aria-label="Share artifact" th:hidden="${!CAN_MANAGE}"><svg aria-hidden="true"><use href="#icon-share"/></svg><span class="button-label">Share</span></button>
      <span class="avatar" id="avatar" th:attr="data-testid=${AVATAR_ID},aria-label=${NAME}" role="img" th:title="|${NAME} · ${EMAIL}|" th:hidden="${!CAN_MANAGE}"><img id="avatar-image" th:src="${PICTURE}" alt="" referrerpolicy="no-referrer" th:hidden="${!HAS_PICTURE}"><span id="avatar-initials" th:hidden="${HAS_PICTURE}" th:text="${INITIALS}">TM</span></span>
    </div>
  </header>
  <aside class="artifact-library" id="artifact-library" aria-labelledby="artifact-library-title" th:attr="data-link-testid=${ARTIFACT_LINK_ID}" hidden>
    <div class="artifact-library-header"><h2 id="artifact-library-title">Your artifacts</h2><button class="icon-button" id="artifacts-close" th:attr="data-testid=${ARTIFACTS_CLOSE_ID}" type="button" aria-label="Close your artifacts"><svg aria-hidden="true"><use href="#icon-close"/></svg></button></div>
    <p class="library-status" id="artifacts-status" role="status"></p>
    <button class="button library-retry" id="artifacts-retry" th:attr="data-testid=${ARTIFACTS_RETRY_ID}" type="button" hidden>Try again</button>
    <nav aria-label="Your other artifacts"><ol class="artifact-library-list" id="artifact-library-list"></ol></nav>
  </aside>
  <div class="artifact-menu" id="artifact-menu" popover role="menu" aria-labelledby="title-menu-trigger">
    <button id="menu-share" th:attr="data-testid=${TITLE_SHARE_ID}" role="menuitem" type="button" th:disabled="${!CAN_MANAGE}"><svg aria-hidden="true"><use href="#icon-share"/></svg>Share</button>
    <button id="menu-reload" th:attr="data-testid=${TITLE_RELOAD_ID}" role="menuitem" type="button" th:disabled="${!CAN_VIEW}"><svg aria-hidden="true"><use href="#icon-reload"/></svg>Reload</button>
  </div>
  <main id="content" th:hidden="${!CAN_VIEW}"><iframe id="artifact-frame" th:attr="data-testid=${FRAME_ID}" th:title="${TITLE}" th:src="${WRAPPER_URL}" sandbox="allow-scripts allow-same-origin" referrerpolicy="no-referrer"></iframe></main>
  <div class="artifact-annotations" id="artifact-annotations" hidden>
    <div class="attached-composer" id="attached-composer" hidden>
      <button class="comment-drag-handle" id="attached-comment-drag" type="button" th:attr="data-testid=${COMMENT_DRAG_ID}" aria-label="Move comment popup" aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight Home" title="Drag to move. Arrow keys move; Home resets."><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor" stroke="none"><circle cx="9" cy="6" r="1.3"/><circle cx="15" cy="6" r="1.3"/><circle cx="9" cy="12" r="1.3"/><circle cx="15" cy="12" r="1.3"/><circle cx="9" cy="18" r="1.3"/><circle cx="15" cy="18" r="1.3"/></g></svg></button>
      <comment-composer id="attached-comment-composer" th:attr="data-body-testid=${COMMENT_BODY_ID},data-post-testid=${COMMENT_POST_ID},data-cancel-testid=${COMMENT_CANCEL_ID}" hidden></comment-composer>
    </div>
  </div>
  <aside class="comments-panel" id="comments-panel" aria-labelledby="comments-title" hidden>
    <div class="comments-header">
      <div class="comments-heading">
        <h2 id="comments-title">Discussions</h2>
        <button class="discussion-filter" id="discussion-filter" type="button" aria-pressed="false" th:attr="data-testid=${THREAD_FILTER_ID},data-resolve-testid=${THREAD_RESOLVE_ID},data-reopen-testid=${THREAD_REOPEN_ID}">Show resolved</button>
      </div>
      <div class="actions"><button class="icon-button selection-toggle" id="element-selection" th:attr="data-testid=${ELEMENT_SELECTION_ID}" aria-label="Select elements for comments" aria-pressed="false" title="Select elements for comments"><svg aria-hidden="true"><use href="#icon-select-element"/></svg></button><button class="icon-button" id="comment-add" th:attr="data-testid=${COMMENT_ADD_ID}" aria-label="Add comment" title="Add comment"><svg aria-hidden="true"><use href="#icon-plus"/></svg></button><button class="icon-button" id="comments-close" th:attr="data-testid=${COMMENTS_CLOSE_ID}" aria-label="Close comments" title="Close comments"><svg aria-hidden="true"><use href="#icon-close"/></svg></button></div>
    </div>
    <comment-composer id="comment-composer" th:attr="data-body-testid=${COMMENT_BODY_ID},data-post-testid=${COMMENT_POST_ID},data-cancel-testid=${COMMENT_CANCEL_ID}" hidden></comment-composer>
    <p class="comments-status" id="comments-status" role="status"></p>
    <button class="button comments-retry" id="comments-retry" th:attr="data-testid=${COMMENT_RETRY_ID}" hidden>Try again</button>
    <div class="discussion-empty" id="discussion-empty" hidden><p>Start a discussion</p><button class="button" id="discussion-start" th:attr="data-testid=${START_DISCUSSION_ID}" type="button">Add comment</button></div>
    <ol class="comments-list" id="comments-list" aria-label="Threads, latest activity first"></ol>
  </aside>
  <section class="blocked" id="blocked" th:hidden="${CAN_VIEW}"><div><svg class="blocked-icon" aria-hidden="true"><use href="#icon-lock"/></svg><h2>Internal Artifact</h2><p>Only team members can view this artifact.<br>Ask the sender to share it publicly.</p></div></section>
  <dialog id="comment-delete-dialog" class="comment-delete-dialog" aria-labelledby="comment-delete-title" aria-describedby="comment-delete-detail" th:attr="data-action-testid=${COMMENT_DELETE_ID}">
    <div class="comment-delete-content">
      <h2 id="comment-delete-title">Delete this comment?</h2>
      <p id="comment-delete-detail"></p>
      <div class="comment-delete-actions">
        <button class="button" id="comment-delete-confirm" type="button" th:attr="data-testid=${COMMENT_DELETE_CONFIRM_ID}">Delete</button>
        <button class="button" id="comment-delete-cancel" type="button" autofocus th:attr="data-testid=${COMMENT_DELETE_CANCEL_ID}">Cancel</button>
      </div>
      <p id="comment-delete-error" role="alert"></p>
    </div>
  </dialog>
  <dialog id="share-dialog" aria-labelledby="share-title" aria-describedby="share-subtitle">
    <div class="dialog-header"><h2 id="share-title">Share Artifact</h2><button class="icon-button" id="close" th:attr="data-testid=${CLOSE_ID}" aria-label="Close sharing dialog"><svg aria-hidden="true"><use href="#icon-close"/></svg></button></div>
    <p class="subtitle" id="share-subtitle" th:text="${TITLE}">Artifact</p>
    <form id="share-form">
      <div class="dialog-body">
        <fieldset><legend>Who can view</legend>
          <label class="option"><input type="radio" id="internal" th:attr="data-testid=${INTERNAL_ID}" name="visibility" value="internal"><svg aria-hidden="true"><use href="#icon-lock"/></svg><span><strong>Internal</strong><small>Team members must sign in to view or download.</small></span></label>
          <label class="option"><input type="radio" id="public" th:attr="data-testid=${PUBLIC_ID}" name="visibility" value="public"><svg aria-hidden="true"><use href="#icon-globe"/></svg><span><strong>Anyone with the link</strong><small>Anyone can view and download. No sign-in required.</small></span></label>
        </fieldset>
        <div class="notice" id="notice"><svg aria-hidden="true"><use href="#icon-clock"/></svg><p id="notice-text"></p></div>
        <hr>
        <div class="link-row"><input id="link" th:attr="data-testid=${URL_ID}" readonly aria-label="Artifact URL"><button class="button" id="copy" type="button" th:attr="data-testid=${COPY_ID}"><svg aria-hidden="true"><use href="#icon-copy"/></svg><span id="copy-label">Copy link</span></button></div>
        <p class="hint" id="link-hint"></p>
        <p class="error" id="error" role="alert"></p>
      </div>
      <div class="dialog-footer"><span id="feedback" role="status"></span><button class="button" id="cancel" th:attr="data-testid=${CANCEL_ID}" type="button">Cancel</button><button class="button primary" id="save" th:attr="data-testid=${SAVE_ID}" type="submit">Save</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <div id="reaction-picker" class="reaction-picker" popover="auto" role="dialog" aria-label="Add emoji reaction" th:attr="data-testid=${REACTION_PICKER_ID},data-add-testid=${REACTION_ADD_ID},data-pill-testid=${REACTION_PILL_ID},data-search-testid=${REACTION_SEARCH_ID},data-emoji-testid=${REACTION_EMOJI_ID},data-category-testid=${REACTION_CATEGORY_ID},data-clear-testid=${REACTION_CLEAR_ID},data-quick-testid=${REACTION_QUICK_ID}"></div>
</body>
</html>
